<!DOCTYPE html>
<html lang="en-GB" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment Tracker</title>
<style>
/* V27 — Microsoft (Fluent 2) style shell. Colours are tokens: change --brand
   to re-theme the whole app (e.g. #c8102e for the school red). */
:root{
  --brand:#0f6cbd; --brand-hover:#115ea3; --brand-pressed:#0c3b5e; --brand-tint:var(--brand-tint); --brand-line:#b4d6fa;
  --appbar:#0f548c; --appbar-ink:#fff;
  --ink:#242424; --ink-soft:#616161; --ink-faint:#8a8a8a;
  --line:#e0e0e0; --line-strong:#d1d1d1; --bg:#f5f5f5; --panel:#fff; --hover:#f5f5f5; --selected:#ebebeb;
  --concern:#b10e1c; --concern-bg:var(--concern-bg); --concern-line:var(--concern-line);
  --watch:#8a3707; --watch-bg:var(--watch-bg); --watch-line:var(--watch-line);
  --secure:#0e700e; --secure-bg:var(--secure-bg); --secure-line:var(--secure-line);
  --missing:#a4262c; --missing-bg:var(--missing-bg);
  --none:#616161; --none-bg:#f5f5f5;
  --shadow2:0 1px 2px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow4:0 2px 4px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow16:0 8px 16px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow64:0 32px 64px rgba(0,0,0,.24),0 0 8px rgba(0,0,0,.2);
  --r:4px; --r-lg:8px;
  --nav-w:232px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/20px "Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:16px;height:16px}

/* ---------- app bar ---------- */
.appbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--appbar);color:var(--appbar-ink);display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;z-index:30}
.appbar .iconbtn{color:var(--appbar-ink)}
.appbar .iconbtn:hover{background:rgba(255,255,255,.12)}
.appname{display:flex;flex-direction:column;line-height:16px;min-width:0;margin-right:8px}
.appname b{font-size:15px;font-weight:600;white-space:nowrap}
.appname span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.appsearch{flex:1;display:flex;justify-content:center;min-width:0}
.appsearch label{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--ink-soft);border-radius:var(--r);padding:0 10px;height:32px;width:100%;max-width:440px}
.appsearch input{border:0;outline:0;padding:0;height:30px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.appsearch input:focus{outline:0}
.savebar{display:flex;align-items:center;gap:8px}
#dirtyFlag,#sourceFlag{font-size:12px;line-height:16px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;white-space:nowrap}
#dirtyFlag.dirty{background:var(--panel);color:var(--concern);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--panel);color:var(--appbar);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;cursor:pointer;border:0}
.appbar .btn.sm{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.appbar .btn.sm:hover{background:rgba(255,255,255,.26)}

/* ---------- navigation rail ---------- */
nav#tabs{position:fixed;top:48px;bottom:0;left:0;width:var(--nav-w);background:var(--surface2);border-right:1px solid var(--line);padding:8px 8px 16px;overflow-y:auto;z-index:20;display:flex;flex-direction:column;gap:2px}
nav#tabs .navhead{font-size:12px;font-weight:600;color:var(--ink-soft);padding:14px 10px 4px}
nav#tabs .navhead:first-child{padding-top:4px}
nav#tabs button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:var(--r);padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;position:relative}
nav#tabs button:hover{background:var(--hover)}
nav#tabs button svg{color:var(--ink-soft)}
nav#tabs button.active{background:var(--selected);font-weight:600}
nav#tabs button.active svg{color:var(--brand-ink)}
nav#tabs button.active::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand)}
nav#tabs .navbadge{margin-left:auto;font-size:11px;font-weight:600;line-height:16px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--missing);color:#fff;text-align:center}
nav#tabs .navfoot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--ink-faint)}
.scrim{display:none}
#navToggle{display:none}

/* ---------- content ---------- */
main{margin-left:var(--nav-w);padding:64px 28px 32px;max-width:calc(1440px + var(--nav-w))}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.pagehead h1{font-size:24px;line-height:32px;font-weight:600;margin:0}
.pagehead p{margin:2px 0 0;color:var(--ink-soft)}
.pagehead .spacer{flex:1}
.cmdbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow4);padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:16px;line-height:22px;font-weight:600}
.panel h3{margin:18px 0 8px;font-size:14px;font-weight:600}
.panel > p.hint{margin:0 0 14px}
.panelhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.panelhead h2{margin:0}
.panelhead .spacer{flex:1}
.hint{color:var(--ink-soft);font-size:13px;line-height:18px}
.muted{color:var(--ink-soft)}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--line-soft);padding:1px 4px;border-radius:3px}

/* ---------- buttons & fields ---------- */
button.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:1px solid transparent;border-radius:var(--r);padding:5px 12px;min-height:32px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button.btn:hover{background:var(--brand-hover)}
button.btn:active{background:var(--brand-pressed)}
button.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
button.btn.ghost:hover{background:var(--hover);border-color:var(--line-strong)}
button.btn.subtle{background:transparent;color:var(--ink);border-color:transparent;font-weight:400}
button.btn.subtle:hover{background:var(--hover)}
button.btn.subtle svg{color:var(--brand-ink)}
button.btn.danger{background:var(--panel);color:var(--concern);border-color:var(--line-strong)}
button.btn.danger:hover{background:var(--concern-bg)}
button.btn.sm{padding:2px 8px;min-height:24px;font-size:12px}
button.iconbtn{background:none;border:0;border-radius:var(--r);width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft)}
button.iconbtn:hover{background:var(--hover)}
button.linkbtn{background:none;border:0;color:var(--brand-ink);font:inherit;cursor:pointer;padding:0;text-align:left}
button.linkbtn:hover{text-decoration:underline}
input,select,textarea{font:inherit;padding:5px 10px;min-height:32px;border:1px solid var(--line-strong);border-bottom-color:var(--line-strong);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:100%}
textarea{line-height:20px}
input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--brand);margin:0}
input:focus,select:focus,textarea:focus{outline:0;border-bottom:2px solid var(--brand);padding-bottom:4px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink)}
label.fld small{font-weight:400;color:var(--ink-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}

/* ---------- tables (DetailsList) ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line-soft);padding:10px 12px;text-align:left;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 8px;line-height:20px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.t-concern{color:var(--concern);background:var(--concern-bg);border-color:var(--concern-line)}
.t-watch{color:var(--watch);background:var(--watch-bg);border-color:var(--watch-line)}
.t-secure{color:var(--secure);background:var(--secure-bg);border-color:var(--secure-line)}
.t-none{color:var(--none);background:var(--none-bg);border-color:var(--line)}
.t-missing{color:#fff;background:var(--missing);border-color:var(--missing)}
.t-brand{color:var(--brand-ink);background:var(--brand-tint);border-color:var(--brand-line)}
tr.row-concern{box-shadow:inset 3px 0 0 var(--concern)}
tr.row-watch{box-shadow:inset 3px 0 0 var(--watch-strong)}
tr.row-missing{background:var(--missing-bg)}
tr.row-missing:hover{background:var(--missing-bg)}
tr.row-missing td:first-child{box-shadow:inset 3px 0 0 var(--missing)}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:6px}
.stat{border-radius:var(--r-lg);padding:14px 16px;background:var(--panel);box-shadow:var(--shadow2);border-top:3px solid var(--line-strong)}
.stat .n{font-size:28px;font-weight:600;line-height:36px}
.stat .l{font-size:13px;color:var(--ink-soft)}
.stat.brand{border-top-color:var(--brand)}
.stat.concern{border-top-color:var(--concern)}
.stat.concern .n{color:var(--concern)}
.stat.watch{border-top-color:var(--watch-strong)}
.stat.watch .n{color:var(--watch)}
.stat.missing{border-top-color:var(--missing);background:var(--missing-bg)}
.stat.missing .n{color:var(--missing)}
.stat[data-drill],.stat[data-goto]{cursor:pointer;transition:box-shadow .12s}
.stat[data-drill]:hover,.stat[data-goto]:hover{box-shadow:var(--shadow16)}
.stat[data-drill] .l::after,.stat[data-goto] .l::after{content:" \203A";font-weight:600}
.stat.on{outline:2px solid var(--brand);outline-offset:-2px}
.bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;display:flex;min-width:120px}
.bar span{display:block;height:100%}
.bar .b-concern{background:var(--concern-strong)}
.bar .b-watch{background:var(--watch-strong)}
.bar .b-secure{background:var(--secure-strong)}
.bar span[data-drill]{cursor:pointer}
.bar span[data-drill]:hover{filter:brightness(1.15)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;line-height:20px;padding:0 8px;border-radius:var(--r);background:var(--line-soft);color:var(--ink)}
.chip.miss{background:var(--missing-bg);color:var(--missing);font-weight:600}
.entrycell input{width:100px}
.entrycell select{width:150px}
.empty{padding:28px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:var(--r-lg)}
.warn{background:var(--watch-bg);border:1px solid var(--watch-line);color:var(--watch);padding:8px 12px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.warn.ok{background:var(--secure-bg);border-color:var(--secure-line);color:var(--secure)}
.warn.bad{background:var(--concern-bg);border-color:var(--concern-line);color:var(--concern)}
.warn.info{background:var(--brand-tint);border-color:var(--brand-line);color:var(--brand-ink)}
details.rules{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;background:var(--surface2);margin-top:12px}
details.rules summary{cursor:pointer;font-weight:600;font-size:13px}
details.rules ul{margin:10px 0 0;padding-left:20px;font-size:13px;color:var(--ink-soft)}
.evidence{font-size:13px;color:var(--ink-soft)}
.pillrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pillrow button{font:inherit;font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;color:var(--ink)}
.pillrow button:hover{background:var(--hover)}
.pillrow button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.trend{font-weight:600;font-size:13px;white-space:nowrap}
.trend.down{color:var(--concern)}
.trend.up{color:var(--secure)}
.trend.flat{color:var(--watch)}
button.cnt{background:none;border:0;padding:2px 6px;margin:-2px -6px;border-radius:var(--r);font:inherit;font-weight:600;color:var(--brand-ink);cursor:pointer}
button.cnt:hover{background:var(--brand-tint);text-decoration:underline}
#dashDrill .panel{outline:2px solid var(--brand);outline-offset:-2px}
#dashDrill .drillhead,.drillhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#dashDrill .drillhead h2{margin:0}
#dashDrill .drillhead .spacer{flex:1}
.backbar{margin-bottom:12px}
#bootBanner .banner{border-radius:var(--r);padding:8px 12px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bootBanner .banner.info{background:var(--brand-tint);border:1px solid var(--brand-line);color:var(--brand-ink)}
#bootBanner .banner.warn2{background:var(--watch-bg);border:1px solid var(--watch-line);color:var(--watch)}
#bootBanner .banner .spacer{flex:1}

/* ---------- compare & gaps ---------- */
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;border:0;background:var(--panel);padding:5px 14px;cursor:pointer;color:var(--ink);border-left:1px solid var(--line-strong)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.vs{font-weight:600;color:var(--ink-soft);padding-bottom:6px}
.delta{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.good{color:var(--secure)}
.delta.bad{color:var(--concern)}
.delta.same{color:var(--ink-soft);font-weight:400}
.pair{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:12px;color:var(--ink-soft);min-width:170px}
.pair .bar{min-width:100px;height:7px}
.heat{border-radius:var(--r);padding:6px 8px;font-size:12.5px;line-height:17px;min-width:96px}
.heat b{font-size:14px}
table.matrix th,table.matrix td{padding:6px 8px;text-align:center}
table.matrix th:first-child,table.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
table.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:230px;max-width:44px;white-space:nowrap;vertical-align:bottom;text-align:left;font-weight:600}
.cell-ok{color:var(--secure)}
.cell-miss{background:var(--missing-bg);color:var(--missing);font-weight:700;cursor:pointer}
.cell-miss:hover{background:var(--missing-bg)}
.cell-na{color:var(--line-strong)}

/* ---------- assessment cards & edit panel ---------- */
.ascards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ascard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.ascard.off{background:var(--surface2)}
.ascard .top{display:flex;gap:8px;align-items:flex-start}
.ascard .top b{font-size:15px;font-weight:600;line-height:20px;flex:1}
.ascard .meta{font-size:12.5px;color:var(--ink-soft)}
.ascard .acts{display:flex;gap:4px;margin-top:auto;padding-top:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);box-shadow:var(--shadow64);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease-out}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:16px 16px 8px 24px}
.drawer header h2{font-size:20px;line-height:28px;font-weight:600;margin:0;flex:1}
.drawer .dbody{flex:1;overflow-y:auto;padding:4px 24px 24px}
.drawer .dfoot{display:flex;gap:8px;padding:12px 24px;border-top:1px solid var(--line)}
.drawer .dfoot .spacer{flex:1}
.dsec{margin-top:18px}
.dsec h3{font-size:14px;font-weight:600;margin:0 0 8px}
.dsec .row{margin-bottom:10px}
.yearpick{display:flex;flex-wrap:wrap;gap:6px}
.yearpick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r);padding:4px 10px;font-size:13px;cursor:pointer}
.yearpick label.on{background:var(--brand-tint);border-color:var(--brand-line)}
.drawerscrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
.drawerscrim.open{display:block}
.typeinfo{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-soft)}

/* ---------- AAA board ---------- */
.aaacols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.aaacol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.aaacolhead{display:flex;align-items:center;gap:8px;border-top:3px solid;margin:-10px -10px 8px;padding:8px 10px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--panel)}
.aaacolhead b{flex:1}
.aaacard{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow2)}
.aaacard:hover{box-shadow:var(--shadow16)}
.aaacard .muted{font-size:12px}
.aaacard.stale{border-left:3px solid var(--watch-strong)}
.aaacard[draggable=true]{cursor:grab}
.aaacard.dragging{opacity:.45}
.aaacol.dropok{outline:2px dashed var(--brand);outline-offset:-2px;background:var(--brand-tint)}
.aaaov{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:900px){.aaaov{grid-template-columns:1fr}}
.yrcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.yrcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.yrcard:hover{box-shadow:var(--shadow8)}
.yrcard.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.yrcard .bar{margin:6px 0 4px;height:10px}
.yrcard small{display:block;color:var(--ink-soft);font-size:12px;line-height:16px}
.movechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.movechip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.movechip.on{border-color:var(--brand);background:var(--brand-tint)}
.movechip.up b{color:var(--secure)}.movechip.down b{color:var(--concern)}
kbd{font:600 11.5px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 4px;background:var(--panel)}
[hidden]{display:none !important}
.printonly{display:none}
@media print{.printonly{display:inline}}
.sortable > thead th{cursor:pointer;user-select:none}
.sortable > thead th:hover{color:var(--brand-ink)}
.sortable > thead th.sorted-asc::after{content:" \25B2";font-size:9px}
.sortable > thead th.sorted-desc::after{content:" \25BC";font-size:9px}
body.staffmode .navfoot::after{content:" · staff copy"}
.lvlin::placeholder{color:var(--ink-faint);font-style:italic;font-weight:400;opacity:1}
.lvlin{width:58px;text-transform:uppercase;text-align:center;font-weight:600}
.lvlin.bad-input{border-color:var(--concern-strong);background:var(--concern-bg)}
.lvlin.s-ahead,.lvlin.s-ontrack{background:var(--secure-bg);border-color:var(--secure-line)}
.lvlin.s-behind{background:var(--watch-bg);border-color:var(--watch-line)}
.lvlin.s-well{background:var(--concern-bg);border-color:var(--concern-line)}
.cegrid td,.cegrid th{padding:4px 6px}
.cegrid th.subj{writing-mode:initial;font-size:12px;max-width:80px;white-space:normal}
.pathpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pathpick button{font:inherit;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;text-align:left}

}
body.loading nav, body.loading .tabpane{display:none!important}
.tabpane:not([hidden]){animation:tpIn .16s ease-out}
[data-theme="dark"] button[role=tab].on,[data-theme="dark"] .linkbtn,[data-theme="dark"] kbd{color:var(--above)!important}
[data-theme="dark"]{--brand-ink:#9cc6ff;--brand-tint:#142740;--brand-line:#2d4f7c}

/* ===================== V31 refresh =====================
   Calmer surfaces, clearer hierarchy, bigger hit targets. Everything above still
   applies; these rules only adjust it, so --brand still re-themes the whole app. */
:root{
  --bg:#f4f6f9; --panel:#fff; --line:#e6e8ec; --line-strong:#d3d7de; --hover:#f2f4f7; --selected:#e8f0fb;
  --ink:#1b1f24; --ink-soft:#5b6370; --ink-faint:#8b929c;
  --appbar:#0f3b66;
  --r:6px; --r-lg:12px;
  --shadow2:0 1px 2px rgba(16,24,40,.06);
  --shadow4:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow16:0 12px 24px -6px rgba(16,24,40,.16),0 4px 8px -4px rgba(16,24,40,.08);
  --nav-w:224px;
}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px}
::selection{background:var(--brand-tint)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* app bar */
.appbar{background:linear-gradient(90deg,var(--appbar),#13508a);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.appname b{font-size:15px;letter-spacing:.1px}
.appsearch label{border-radius:999px;background:rgba(255,255,255,.95);height:34px;padding:0 14px}
#dirtyFlag,#sourceFlag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}

/* navigation rail */
nav#tabs{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 16px;gap:2px}
nav#tabs .navhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:16px 12px 6px}
nav#tabs button{padding:9px 12px;border-radius:8px;color:var(--ink-soft);font-weight:500;transition:background .12s,color .12s}
nav#tabs button:hover{background:var(--hover);color:var(--ink)}
nav#tabs button.active{background:var(--brand-tint);color:var(--brand-ink);font-weight:600}
nav#tabs button.active::before{display:none}
nav#tabs button.active svg{color:var(--brand-ink)}
nav#tabs .navbadge.warnb{background:var(--watch-strong)}
nav#tabs .navfoot{color:var(--ink-faint);font-size:11.5px}

/* page */
main{padding:68px 32px 40px}
.pagehead{margin:0 0 18px;align-items:center}
.pagehead h1{font-size:26px;line-height:34px;font-weight:650;letter-spacing:-.2px}
.pagehead p{font-size:14px;max-width:820px}
.panel{border:1px solid var(--line);box-shadow:var(--shadow2);padding:20px 22px;margin-bottom:18px}
.panel h2{font-size:16px;font-weight:650}
.panel h3{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:22px 0 8px}
.hint{font-size:13px;line-height:19px}
.muted.sm,.sm.muted{font-size:12px}

/* sub-pages: a pivot under the title area */
.pivot{display:flex;gap:4px;margin:-4px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pivot::-webkit-scrollbar{display:none}
.pivot button{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 14px 12px;font:inherit;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}
.pivot button:hover{color:var(--ink);background:var(--hover)}
.pivot button.on{color:var(--ink);font-weight:650}
.pivot button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.pivbadge{font-size:11px;font-weight:650;line-height:16px;min-width:18px;padding:0 6px;border-radius:99px;background:var(--missing);color:#fff;text-align:center}
.pivbadge.warnb{background:var(--watch-strong)}

/* buttons and fields */
button.btn{border-radius:8px;min-height:34px;padding:6px 14px;font-weight:600;box-shadow:0 1px 1px rgba(16,24,40,.06);transition:background .12s,border-color .12s,box-shadow .12s}
button.btn.ghost{border-color:var(--line-strong)}
button.btn.subtle{box-shadow:none}
button.btn.sm{min-height:26px;padding:2px 10px;border-radius:6px}
input,select,textarea{border-radius:8px;border:1px solid var(--line-strong);min-height:34px;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--ink-faint)}
input:focus,select:focus,textarea:focus{border:1px solid var(--brand);padding-bottom:5px;box-shadow:0 0 0 3px rgba(15,108,189,.15)}
input[type=checkbox]{box-shadow:none}
label.fld{font-weight:600;font-size:12.5px;color:var(--ink-soft)}

/* tables: header row sticks while you scroll the page */
.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:78vh}
.tablewrap > table{margin:0}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
th{position:sticky;top:0;z-index:2;background:var(--surface2);color:var(--ink-soft);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
table.matrix th:first-child,table.matrix td:first-child{background:var(--panel)}
table.matrix thead th:first-child{background:var(--surface2);z-index:3}
.tag{border-radius:6px;line-height:20px;padding:0 8px;font-weight:600}
.chip{border-radius:6px;background:var(--line-soft)}

/* stat tiles */
.stats{gap:14px}
.stat{border:1px solid var(--line);border-top:1px solid var(--line);box-shadow:var(--shadow2);padding:16px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-strong)}
.stat.brand::before{background:var(--brand)}
.stat.concern::before{background:var(--concern)}
.stat.watch::before{background:var(--watch-strong)}
.stat.missing::before{background:var(--missing)}
.stat .n{font-size:30px;line-height:38px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{line-height:18px}
.stat[data-drill]:hover,.stat[data-goto]:hover,button.stat:hover{box-shadow:var(--shadow16);transform:translateY(-1px)}
.stat{transition:box-shadow .15s,transform .15s}

/* pupil profile header */
.profhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:4px 0 16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.profhead .profname{font-size:24px;line-height:32px;font-weight:650;margin:0 0 6px;letter-spacing:-.2px}
.profhead .spacer{flex:1}

/* side panel: the wide version holds Pupil settings */
.drawer{border-radius:14px 0 0 14px}
.drawer.wide{width:min(1280px,100vw)}
.drawer header{padding:20px 20px 10px 28px;border-bottom:1px solid var(--line)}
.drawer .dbody{padding:8px 28px 28px}
.drawer .dfoot{padding:14px 28px;background:var(--surface2);border-radius:0 0 0 14px}
table.settable td{vertical-align:middle}
table.settable select{max-width:220px}

/* passphrase dialog */
.passscrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.passbox{background:var(--panel);border-radius:14px;box-shadow:var(--shadow64);padding:24px 26px;width:min(440px,100%)}
.passbox h2{margin:0 0 6px;font-size:20px;font-weight:650}
.passbox label.fld{margin-top:10px}
.passbox input[type=password]{width:100%}
.passrem{display:flex;gap:8px;align-items:center;margin:12px 0 6px;font-size:13.5px}
/* data checks */
.qsec.qok{opacity:1}
.qsec.qok .hint{display:none}
.qsec .panelhead{margin-bottom:6px}

/* banners and notes */
.warn{border-radius:8px}
#bootBanner .banner{border-radius:10px;padding:10px 14px}
.empty{border-radius:12px;background:var(--surface2)}

/* small screens */
@media(max-width:900px){
  main{padding:62px 14px 24px}
  .tablewrap{max-height:none}
  .pagehead h1{font-size:22px}
}
@media print{
  .tablewrap{border:0;max-height:none;overflow:visible}
  th{position:static}
  .stat::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ===================== V33: data sources, dialogs, toasts ===================== */
.srccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.srccard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}

ul.checklist{margin:6px 0 0;padding-left:18px;font-size:13px;max-height:260px;overflow:auto}

ol.steps{padding-left:20px;margin:4px 0}

table.cmpcounts{margin-top:8px}
.startcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:16px 20px;margin-bottom:16px}

body:not(.inpa) .onlypa{display:none!important}

.small{font-size:12px}

/* ===================== V34 design system =====================
   Calm, clean and readable. Every colour is a token; the brand colour (Settings) drives the
   accents and is kept readable. Status colours avoid alarm: blue = ahead, teal = on track,
   amber = behind, coral = well behind, always with a word and an icon as well as colour.
   Light, dark (or follow the computer) and a high-contrast mode. */
:root,[data-theme="light"]{
  --bg:#f4f6f9; --panel:#ffffff; --surface2:#f8f9fb; --hover:#f1f4f8; --selected:#e8f0fb;
  --ink:#16191f; --ink-soft:#4b5563; --ink-faint:#6b7280;
  --line:#e3e6eb; --line-strong:#cfd5dd; --line-soft:#eef0f3;
  --above:#1d5fae; --above-bg:#eaf2fc; --above-line:#b7d0f0; --above-strong:#3b82f6;
  --secure:#0f6b62; --secure-bg:#e7f5f3; --secure-line:#9fd3cc; --secure-strong:#2a9d8f;
  --watch:#8a4b06; --watch-bg:#fff6e5; --watch-line:#f2cd8a; --watch-strong:#e9a23b;
  --concern:#a8431d; --concern-bg:#fdf0ea; --concern-line:#efb59c; --concern-strong:#dd7448;
  --missing:#7a3f86; --missing-bg:#f6eef8; --missing-line:#dcc2e3;
  --none:#4b5563; --none-bg:#f1f4f8;
  --focus:#1d5fae; --brand-ink:#0f6cbd;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t-h1:28px; --t-h2:18px; --t-h3:14px; --t-body:14px; --t-label:12.5px;
  --dur:180ms;
  color-scheme:light;
}
[data-theme="dark"]{
